name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Release gate
        run: python scripts/release_check.py
      - name: Unit + chaos + nuclear (forensics)
        run: python -m pytest tests -q --tb=short
      - name: Security loop example
        env:
          SAGE_PACK_KEY: ci-key
        run: python examples/security_verify_loop.py
      - name: Auditor kit (pinned Ed25519)
        env:
          SAGE_PACK_KEY: ci-key
        run: python examples/auditor_kit.py
      - name: Strict handoff smoke
        run: python scripts/ci_smoke.py
