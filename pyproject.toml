[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sage-incident-bundles"
version = "2.2.0"
description = "Fail-closed agent incident forensics: portable sealed bundles, custody, and third-party verify."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "FSL-1.1-ALv2" }
authors = [
  { name = "Fratres-X-AI" }
]
keywords = [
  "agents",
  "forensics",
  "security",
  "audit",
  "observability",
  "opentelemetry",
  "replay",
  "custody",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Testing",
]
# Core recorder / CAS / verify / CLI are stdlib-only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.0", "cryptography>=42"]
sign = ["cryptography>=42"]
attr = ["numpy>=1.26"]
train = ["numpy>=1.26", "torch>=2.2"]
tui = ["textual>=0.80"]
all = [
  "pytest>=8.0",
  "numpy>=1.26",
  "torch>=2.2",
  "textual>=0.80",
  "build>=1.0",
  "cryptography>=42",
]

[project.scripts]
sage = "sage.cli:main"

[project.urls]
Homepage = "https://github.com/Fratres-X-AI/SAGE"
Repository = "https://github.com/Fratres-X-AI/SAGE"
Issues = "https://github.com/Fratres-X-AI/SAGE/issues"
Documentation = "https://github.com/Fratres-X-AI/SAGE#readme"
Changelog = "https://github.com/Fratres-X-AI/SAGE/blob/main/CHANGELOG.md"
Security = "https://github.com/Fratres-X-AI/SAGE/blob/main/SECURITY.md"
Threat-Model = "https://github.com/Fratres-X-AI/SAGE/blob/main/THREAT_MODEL.md"


[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["generated", "artifacts", "pod_export"]
addopts = "--ignore=tests/generated --ignore=tests/test_attribution.py"
markers = [
  "slow: long-running nuclear / stress tests",
]
